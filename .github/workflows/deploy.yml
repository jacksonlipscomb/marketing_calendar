name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy-supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Pin the CLI version: `latest` makes the action resolve the newest release
      # over the network at deploy time, which 504'd once ("Failed to resolve
      # latest Supabase CLI release: Gateway Time-out"). A pinned version skips that
      # lookup and matches the `supabase` devDependency / local CLI.
      - uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
      # db push only works against a linked project; the runner starts unlinked,
      # so link explicitly first (non-interactive via SUPABASE_DB_PASSWORD).
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Apply migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Deploy edge function
        run: supabase functions deploy schedule-email --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy-frontend:
    # Gate on the DB job: a migration-bearing deploy must not ship a frontend
    # against an un-migrated schema. If deploy-supabase fails (incl. a flake), the
    # frontend deploy is held until it's re-run green.
    needs: deploy-supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_OWNER_EMAIL: ${{ secrets.VITE_OWNER_EMAIL }}
      # `pages deploy` fails if the Pages project doesn't exist yet; create it
      # idempotently (the create errors harmlessly when it already exists, and a
      # real config problem will still fail loudly in the deploy step below).
      - name: Ensure Pages project exists
        run: npx --yes wrangler pages project create marketing-calendar --production-branch=main || echo "Pages project already exists; continuing"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=marketing-calendar
